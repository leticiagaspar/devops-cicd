name: Build and push docker images
on:
  # triggered when the "Test backend" workflow finishes, only for the main branch
  workflow_run:
    workflows: ["Test backend"]
    types:
      - completed
    branches:
      - main

jobs:
  build-and-push-docker-image:
    # run only if the tests passed, and only for a push (not a pull request)
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-24.04

    steps:
      # checkout the exact commit that was tested
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # log in to Docker Hub with credentials stored in GitHub secrets (never in plain text)
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # build and push the backend image from ./simple-api
      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          tags: ${{secrets.DOCKERHUB_USERNAME}}/tp-devops-simple-api:latest
          push: true

      # build and push the database image from ./database
      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: ${{secrets.DOCKERHUB_USERNAME}}/tp-devops-database:latest
          push: true

      # build and push the httpd (reverse proxy) image from ./http-server
      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: ${{secrets.DOCKERHUB_USERNAME}}/tp-devops-httpd:latest
          push: true

      # build and push the front image from ./front
      - name: Build image and push front
        uses: docker/build-push-action@v6
        with:
          context: ./front
          tags: ${{secrets.DOCKERHUB_USERNAME}}/tp-devops-front:latest
          push: true

  # continuous deployment: run the Ansible playbook from a Docker image, with secrets encrypted by Ansible Vault
  deploy:
    needs: build-and-push-docker-image
    runs-on: ubuntu-24.04

    steps:
      # checkout the exact commit that was tested and built
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # write the SSH key and the vault password from GitHub secrets, and trust the server's host key
      - name: Set up SSH key and vault password
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/takima_key
          chmod 400 ~/.ssh/takima_key
          ssh-keyscan -H marialeticia.donascimentogaspar.takima.school >> ~/.ssh/known_hosts
          printf '%s' "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > "$RUNNER_TEMP/vault_pass"

      # build the image that provides Ansible
      - name: Build Ansible image
        run: docker build -t ansible-runner ./ansible

      # deploy: run the playbook inside the Ansible container; the vault password decrypts the secrets
      - name: Deploy with Ansible (Docker + Vault)
        run: |
          docker run --rm \
            -v "$PWD/ansible:/ansible" \
            -v "$HOME/.ssh:/root/.ssh:ro" \
            -v "$RUNNER_TEMP/vault_pass:/vault_pass:ro" \
            ansible-runner \
            ansible-playbook -i inventories/setup.yml playbook.yml --vault-password-file /vault_pass
