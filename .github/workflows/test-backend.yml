name: Test backend
on:
  # run tests on every push to main and develop
  push:
    branches:
      - main
      - develop
  # and on every pull request
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      # checkout the code; fetch-depth: 0 gets the full git history, used by SonarCloud to detect new code
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # set up JDK 21 (Temurin) and cache Maven dependencies between runs
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # build the app and run unit + integration tests (testcontainers starts a PostgreSQL container)
      - name: Build and test with Maven
        run: mvn clean verify --file ./simple-api/pom.xml

      # quality gate: send the code to SonarCloud for analysis (bugs, vulnerabilities, code smells, duplications)
      # the token is stored in GitHub secrets, never in plain text
      # full plugin name is used because the sonar plugin is not declared in the pom.xml
      - name: SonarCloud analysis
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=leticiagaspar_devops-cicd -Dsonar.organization=leticiagaspar -Dsonar.host.url=https://sonarcloud.io -Dsonar.token=${{ secrets.SONAR_TOKEN }} --file ./simple-api/pom.xml
