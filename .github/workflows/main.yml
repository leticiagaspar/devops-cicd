name: CI devops 2025
on:
  # launch the pipeline on every push to main and develop
  push:
    branches:
      - main
      - develop
  # and on every pull request
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      # checkout your github code using actions/checkout@v4
      - uses: actions/checkout@v4

      # set up JDK 21 (Temurin) and cache Maven dependencies between runs
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # build the app and run unit + integration tests (testcontainers starts a PostgreSQL container)
      - name: Build and test with Maven
        run: mvn clean verify --file ./simple-api/pom.xml
