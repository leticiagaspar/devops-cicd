name: CI devops 2025
on:
  # launch the pipeline on every push to main and develop
  push:
    branches:
      - main
      - develop
  # and on every pull request
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-24.04
    steps:
      # checkout your github code using actions/checkout@v4
      - uses: actions/checkout@v4

      # set up JDK 21 (Temurin) and cache Maven dependencies between runs
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # build the app and run unit + integration tests (testcontainers starts a PostgreSQL container)
      - name: Build and test with Maven
        run: mvn clean verify --file ./simple-api/pom.xml

  # define job to build and publish docker image
  build-and-push-docker-image:
    # run only when code is compiling and tests are passing
    needs: test-backend
    runs-on: ubuntu-24.04

    # steps to perform in job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # log in to Docker Hub with credentials stored in GitHub secrets (never in plain text)
      - name: Login to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      # build the backend image from ./simple-api; build on feature branches, push only on main
      - name: Build image and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./simple-api
          tags: ${{secrets.DOCKERHUB_USERNAME}}/tp-devops-simple-api:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      # build the database image from ./database; push only on main
      - name: Build image and push database
        uses: docker/build-push-action@v6
        with:
          context: ./database
          tags: ${{secrets.DOCKERHUB_USERNAME}}/tp-devops-database:latest
          push: ${{ github.ref == 'refs/heads/main' }}

      # build the httpd (reverse proxy) image from ./http-server; push only on main
      - name: Build image and push httpd
        uses: docker/build-push-action@v6
        with:
          context: ./http-server
          tags: ${{secrets.DOCKERHUB_USERNAME}}/tp-devops-httpd:latest
          push: ${{ github.ref == 'refs/heads/main' }}
